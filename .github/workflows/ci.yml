name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: プロトコルの単体テスト
        run: node --test tests/
      - name: JavaScript の構文チェック
        run: for f in static/js/*.js static/js/boards/*.js; do node --check "$f"; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python の構文チェック
        run: python -m py_compile server.py tools/sim_boards.py
